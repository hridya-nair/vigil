name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -g -Werror"
      - name: Tests
        run: make test

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test-asan

  fuzz:
    name: fuzz parser (libFuzzer, 2 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz lexer, parser and expander
        run: make fuzz FUZZ_SECONDS=120
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*
